<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Successful | Samara Assisted Living</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#fff7fb;color:#4d1835;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 36px));box-sizing:border-box;background:#fff;border:1px solid #f3c8dc;border-radius:24px;padding:34px;text-align:center;box-shadow:0 14px 42px rgba(176,24,103,.14)}h1{margin:8px 0;color:#b01867;font-size:30px}.tick{width:68px;height:68px;border-radius:50%;margin:auto;background:#eaf9f0;color:#14844f;display:grid;place-items:center;font-size:40px;font-weight:700}.amount{font-size:34px;font-weight:800;color:#14844f;margin:18px 0 6px}.ref{background:#fff1f7;border-radius:12px;padding:12px;margin:18px 0;color:#7b3157}.small{font-size:14px;color:#76566a;line-height:1.5}.close-btn{display:block;width:100%;margin-top:22px;padding:15px;border:0;border-radius:14px;background:#b01867;color:#fff;font-size:17px;font-weight:700;cursor:pointer}.close-btn:active{opacity:.85}</style></head>
<body><main class="card"><div class="tick">✓</div><h1>Payment Successful</h1><p>Your payment has been received by Samara Assisted Living.</p><div class="amount" id="amount"></div><div class="ref" id="reference"></div><p class="small">The payment has been recorded against the Samara billing account. You may safely close this page.</p><button type="button" class="close-btn" id="closeBtn">Close</button></main>
<script>const q=new URLSearchParams(location.search);const a=Number(q.get('amount')||0);document.getElementById('amount').textContent=a?new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(a):'';const r=q.get('request')||'';document.getElementById('reference').textContent=r?'Payment Request: '+r:'';document.getElementById('closeBtn').addEventListener('click',function(){try{window.close()}catch(e){}setTimeout(function(){location.replace('https://www.samaraassistedliving.com/')},400)});</script></body></html>
