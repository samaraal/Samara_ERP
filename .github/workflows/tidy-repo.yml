# ONE-TIME tidy-up of the repository (Samara ERP).
# Run it from the Actions tab: "Tidy repository (one time)" -> Run workflow.
# It only MOVES files the website does not use into folders, in a single commit,
# then deletes itself. Nothing the live site loads is moved (checked before committing).
name: Tidy repository (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Move files into folders
        run: |
          set -euo pipefail
          mkdir -p docs/release-notes supabase/sql supabase/function-copies archive
          moved=0

          move() {  # move <file> <folder>  (never overwrites)
            src="$1"; dest="$2/$(basename "$1")"
            if [ -e "$dest" ]; then
              if cmp -s "$src" "$dest"; then git rm -q "$src"; echo "removed duplicate: $src (identical copy already in $2)";
              else git mv "$src" "$2/root-copy-$(basename "$1")"; echo "moved: $src -> $2/root-copy-$(basename "$1")"; fi
            else
              git mv "$src" "$dest"; echo "moved: $src -> $dest"
            fi
            moved=$((moved+1))
          }

          shopt -s nullglob
          for f in *.md *.txt; do
            case "$f" in README.md|CHANGELOG.md) continue;; esac
            move "$f" docs/release-notes
          done
          for f in *.sql; do move "$f" supabase/sql; done
          for f in *.ts;  do move "$f" supabase/function-copies; done
          for f in samara-gradient-theme.css styles-2.0.0.css styles-1.3.51-clinical-charges.css food-vendor-backend-source.zip; do
            [ -e "$f" ] && move "$f" archive
          done
          echo "Total files moved: $moved"

      - name: Safety check - every file the site loads is still in place
        run: |
          set -euo pipefail
          missing=0
          for f in $(grep -oE '(src|href)="\./[^"?]+' index.html | sed -E 's/^(src|href)="\.\///'); do
            [ -e "$f" ] || { echo "::error::index.html needs $f but it is missing"; missing=1; }
          done
          for f in $(grep -oE "\./[A-Za-z0-9_./-]+\.(js|css|png|jpg|webmanifest|html)" service-worker.js | sed 's#^\./##' | sort -u); do
            [ -e "$f" ] || { echo "::error::service-worker.js needs $f but it is missing"; missing=1; }
          done
          for f in app.js index.html styles.css config.js CNAME service-worker.js 404.html; do
            [ -e "$f" ] || { echo "::error::$f is missing"; missing=1; }
          done
          [ "$missing" = 0 ] || { echo "Stopping: nothing has been committed."; exit 1; }
          echo "All files needed by the live site are present."

      - name: Commit (and remove this one-time workflow)
        run: |
          git rm -q .github/workflows/tidy-repo.yml
          git config user.name "samara-build-bot"
          git config user.email "samara-build-bot@users.noreply.github.com"
          git commit -q -m "Tidy repository: notes to docs/, SQL to supabase/sql/, function copies and old files to folders"
          git push
          echo "Done."
