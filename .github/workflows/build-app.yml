# Samara ERP — Build app.js from src/app AND publish the website.
# Runs on every commit to main (and on "Run workflow").
# - If src/app changed: rebuilds app.js and commits it.
# - If the rebuilt app.js has a syntax error: stops. Nothing is published; the live site stays as it was.
# - Then publishes the site to GitHub Pages (Settings → Pages → Source must be "GitHub Actions").
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Did this commit change src/app?
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(src/app/|tools/build-app.js)'; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app.js from src/app
        if: steps.changes.outputs.src == 'true'
        run: node tools/build-app.js

      - name: Commit rebuilt app.js (only if it changed)
        if: steps.changes.outputs.src == 'true'
        run: |
          if git diff --quiet -- app.js; then
            echo "app.js already up to date."
          else
            git config user.name "samara-build-bot"
            git config user.email "samara-build-bot@users.noreply.github.com"
            git add app.js
            git commit -m "Rebuild app.js from src/app"
            git push
          fi

      # Stops here (nothing published) if app.js was uploaded directly and differs from src/app.
      - name: Check app.js matches src/app
        run: |
          node tools/build-app.js --check || {
            echo "::error::app.js does not match src/app. Put the change into the matching file in src/app instead of uploading app.js. The live site was NOT changed.";
            exit 1; }

      - name: Prepare website files
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
          ls _site | head -50

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
